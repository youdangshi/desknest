name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore DeskNest.slnx

      - name: 编译
        run: dotnet build DeskNest.slnx -c Release --no-restore

      - name: 测试
        run: dotnet test tests/DeskNest.Tests/DeskNest.Tests.csproj -c Release --no-build --verbosity normal

      - name: 发布自包含版本
        run: dotnet publish src/DeskNest.App/DeskNest.App.csproj -c Release -r win-x64 --self-contained true -o dist/DeskNest

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DeskNest-win-x64
          path: dist/DeskNest
